# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: keel

release:
  prerelease: auto

builds:
  - skip: true

archives:
  - formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files: [ LICENSE, README.md ]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
