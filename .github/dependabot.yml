# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

updates:
  - package-ecosystem: github-actions
    commit-message: { prefix: 'chore(deps)' }
    directory: '/'
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    groups:
      deps:
        applies-to: version-updates
        patterns: [ '*' ]
      security:
        applies-to: security-updates
        patterns: [ '*' ]
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    commit-message: { prefix: 'chore(deps)' }
    directories: [ '**/*' ]
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    ignore:
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]
    groups:
      deps:
        applies-to: version-updates
        patterns: [ '*' ]
        exclude-patterns: [ 'github.com/foomo/*' ]
      foomo:
        applies-to: version-updates
        patterns: [ 'github.com/foomo/*' ]
      security:
        applies-to: security-updates
        patterns: [ '*' ]
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
      exclude: [ 'github.com/foomo/*' ]
